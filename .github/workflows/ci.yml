name: ci
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      OPENFHE_VERSION: v1.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache OpenFHE
        id: cache-openfhe
        uses: actions/cache@v4
        with:
          path: ~/openfhe
          key: openfhe-${{ env.OPENFHE_VERSION }}-ubuntu-24.04
      - name: Build OpenFHE
        if: steps.cache-openfhe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OPENFHE_VERSION" https://github.com/openfheorg/openfhe-development.git
          cmake -S openfhe-development -B openfhe-development/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_UNITTESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX=$HOME/openfhe
          cmake --build openfhe-development/build
          cmake --install openfhe-development/build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=$HOME/openfhe
          cmake --build build
      - name: Test
        run: ./build/test_fheml
      - name: Encrypted MNIST (insecure toy parameters for speed)
        run: ./build/mnist_cnn --encrypted 2 --insecure
